<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./node_modules/cropperjs/dist/cropper.min.css" />
  <title>Генератор фотокалендарей</title>
</head>

<body>
  <!-- New project overlay -->
  <button class="new-project-overlay-trigger-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-plus-icon lucide-calendar-plus">
      <path d="M16 19h6" />
      <path d="M16 2v4" />
      <path d="M19 16v6" />
      <path d="M21 12.598V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.5" />
      <path d="M3 10h18" />
      <path d="M8 2v4" />
    </svg>
  </button>

  <section class="new-project-section">
    <div class="new-project-section__close-modal">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-square-x-icon lucide-square-x">
        <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
        <path d="m15 9-6 6" />
        <path d="m9 9 6 6" />
      </svg>
    </div>

    <div class="new-project-section__mode-radio-btns">
      <div class="single">
        <input type="radio" id="single-page" name="calendar-mode" value="single-page" />
        <label for="single-page">Одностраничный</label>
      </div>
      <div class="multi">
        <input type="radio" id="multi-page" name="calendar-mode" value="multi-page" checked />
        <label for="multi-page">Многостраничный</label><br />
      </div>
    </div>

    <div class="new-project-section__calendar-options">
      <select id="year-input"></select>
      <select id="month-input"></select>

      <select id="lang-input">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>

      <select id="font-input"></select>
      <select id="format-input"></select>
    </div>

    <div class="get-button-container">
      <button id="get-button">Создать</button>
    </div>
  </section>

  <div class="new-project-bg"></div>

  <!-- Calendar mockup -->
  <div class="calendar-container"></div>
  <div class="controls-container hide"></div>
  <div class="crop-controls-container hide"></div>
</body>

<script type="module" src="./src/lib/main.ts"></script>

</html>
