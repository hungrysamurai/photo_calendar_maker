<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./node_modules/cropperjs/dist/cropper.min.css" />
  <title>Генератор фотокалендарей</title>
</head>

<body>

  <!-- New project overlay -->
  <button class="new-project-overlay-trigger-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="lucide lucide-file-plus-corner-icon lucide-file-plus-corner">
      <path
        d="M11.35 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v5.35" />
      <path d="M14 2v5a1 1 0 0 0 1 1h5" />
      <path d="M14 19h6" />
      <path d="M17 16v6" />
    </svg>
  </button>


  <section class="new-project-section">
    <div class="row-1">
      <div class="mode-radio-container">
        <div class="single">
          <input type="radio" id="single-page" name="calendar-mode" value="single-page" />
          <label for="single-page">Single-page</label>
        </div>
        <div class="multi">
          <input type="radio" id="multi-page" name="calendar-mode" value="multi-page" checked />
          <label for="multi-page">Multi-page</label><br />
        </div>
      </div>
    </div>

    <div class="row-2">
      <div class="select-options-container">
        <select id="year-input"></select>

        <select id="month-input"></select>

        <select id="lang-input">
          <option value="ru">Ru</option>
          <option value="en">En</option>
        </select>

        <select id="font-input"></select>
        <select id="format-input"></select>
      </div>

      <div class="get-button-container">
        <button id="get-button">Get!</button>
      </div>
    </div>
  </section>

  <div class="new-project-bg"></div>

  <!-- Calendar mockup -->
  <div class="calendar-container"></div>
  <div class="controls-container hide"></div>
  <div class="crop-controls-container hide"></div>
</body>

<script type="module" src="./src/lib/main.ts"></script>

</html>
